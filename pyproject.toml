[project]
name = "urbafoam"
version = "0.1.0"
description = ""
authors = [{ name = "Dag Wästberg", email = "dwastberg@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pystache>=0.6",
    "shapely>=2.0",
    "scipy>=1.14",
    "click>=8.0",
    "trimesh>=4.0",
    "tomlkit>=0.15.2",
    "geopandas>=1.2.0",
    "manifold3d>=3.5.5",
    "pydantic>=2.14.4",
]

[project.scripts]
urbafoam = "urbafoam:cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
